<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNOTES - Riwayat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* (MASUKKAN SEMUA KODE CSS DARI FILE LO-FI MILIKMU DI SINI) */
        :root{--bg-dark:#fff;--text-main:#333} *{box-sizing:border-box;margin:0;padding:0} body{background-color:var(--bg-dark);color:var(--text-main);font-family:'Inter',sans-serif;overflow:hidden} .app-container{display:grid;grid-template-columns:240px 1fr 320px;height:100vh} .sidebar{background-color:#fff;border-right:2px solid #000;padding:24px;display:flex;flex-direction:column} .logo{font-size:24px;font-weight:700;color:#000;margin-bottom:40px;display:flex;align-items:center;gap:10px} .nav-menu{list-style:none;display:flex;flex-direction:column;gap:8px} .nav-item{padding:12px 16px;border-radius:0;color:#000;font-weight:400;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent} .nav-item.active{background-color:#e0e0e0;border:1px solid #000;font-weight:700} .main-content{padding:32px 40px;overflow-y:auto;background:#fff} .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;border-bottom:2px solid #000;padding-bottom:16px} .page-title{font-size:32px;font-weight:700;color:#000} .btn-quick-add{background-color:#fff;color:#000;border:2px solid #000;padding:10px 20px;font-weight:400;display:flex;align-items:center;gap:8px} .page{display:block} .ai-panel{background-color:#fff;border-left:2px solid #000;display:flex;flex-direction:column} .filter-btn{background:#fff;border:1px solid #000;padding:8px 16px;font-size:13px} .filter-btn.active{background:#000;color:#fff} .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px} .task-card{border:2px solid #000;padding:24px;opacity:0.8} .badge{font-size:11px;padding:6px 10px;border:1px solid #000;margin-top:8px;display:inline-block} .status-badge{font-size:11px;padding:3px 8px;border:1px solid #000;margin-left:8px;background:#fff}
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><span style="border: 1px solid #000; padding: 2px 6px;">Logo</span> EduNOTES</div>
        <nav class="nav-menu">
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Dasbor Saya</div>
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Kalender</div>
            <div class="nav-item active"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Riwayat</div>
        </nav>
        <div style="margin-top: auto; padding-top: 16px; border-top: 2px solid #000;">
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Account</div>
        </div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1 class="page-title">Riwayat Tugas</h1>
            <div style="display: flex; gap: 16px;">
                <button class="btn-quick-add"><span style="border: 1px solid #000; width: 12px; height: 12px;"></span> AI Panel</button>
                <button class="btn-quick-add">[+] Tambah Tugas Cepat</button>
            </div>
        </header>
        <div class="page">
            <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
                <button class="filter-btn active">Semua</button>
                <button class="filter-btn">[v] Selesai</button>
                <button class="filter-btn">[x] Terlewat</button>
                <button class="filter-btn">[-] Dihapus</button>
            </div>
            <div class="task-grid">
                <div class="task-card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <h3 style="font-size:15px; text-decoration:line-through; margin-bottom:4px;">Tugas Spring Boot</h3>
                            <p style="font-size:13px; margin-bottom:10px;">Pemrograman Web</p>
                            <span class="badge">Aksi: 2 Mei 2026</span>
                        </div>
                        <span class="status-badge">[v] Selesai</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <aside class="ai-panel">
        <div style="padding: 24px; border-bottom: 2px solid #000; display: flex; justify-content: space-between;">
            <div>[ai] Asisten AI</div><span>x</span>
        </div>
        <div style="padding: 24px;">
            <button style="width:100%; background:#fff; border:2px solid #000; padding:12px;">[+] Generate Jadwal Optimal</button>
        </div>
    </aside>
</div>
</body>
</html>
