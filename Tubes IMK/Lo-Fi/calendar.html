<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNOTES - Kalender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* (MASUKKAN SEMUA KODE CSS DARI FILE LO-FI MILIKMU DI SINI) */
        :root{--bg-dark:#fff;--text-main:#333} *{box-sizing:border-box;margin:0;padding:0} body{background-color:var(--bg-dark);color:var(--text-main);font-family:'Inter',sans-serif;overflow:hidden} .app-container{display:grid;grid-template-columns:240px 1fr 320px;height:100vh} .sidebar{background-color:#fff;border-right:2px solid #000;padding:24px;display:flex;flex-direction:column} .logo{font-size:24px;font-weight:700;color:#000;margin-bottom:40px;display:flex;align-items:center;gap:10px} .nav-menu{list-style:none;display:flex;flex-direction:column;gap:8px} .nav-item{padding:12px 16px;border-radius:0;color:#000;font-weight:400;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent} .nav-item.active{background-color:#e0e0e0;border:1px solid #000;font-weight:700} .main-content{padding:32px 40px;overflow-y:auto;background:#fff} .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;border-bottom:2px solid #000;padding-bottom:16px} .page-title{font-size:32px;font-weight:700;color:#000} .btn-quick-add{background-color:#fff;color:#000;border:2px solid #000;padding:10px 20px;font-weight:400;display:flex;align-items:center;gap:8px} .page{display:block} .ai-panel{background-color:#fff;border-left:2px solid #000;display:flex;flex-direction:column} .suggestion-box{border:1px solid #000;padding:16px;margin-bottom:16px} .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px} .task-card{border:2px solid #000;padding:24px} .task-card.urgent{border-left-width:8px} .badge{font-size:11px;padding:6px 10px;border:1px solid #000;margin-top:8px;display:inline-block;text-transform:uppercase} #calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px} .cal-day{min-height:90px;border:1px solid #000;padding:8px} .cal-day.today{border:2px solid #000;font-weight:bold} .cal-day.selected{border:2px dashed #000} .cal-day-num{font-size:12px} .cal-task-label{font-size:9px;padding:2px 5px;border:1px solid #000;margin-top:3px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid #000}
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><span style="border: 1px solid #000; padding: 2px 6px;">Logo</span> EduNOTES</div>
        <nav class="nav-menu">
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Dasbor Saya</div>
            <div class="nav-item active"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Kalender</div>
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Riwayat</div>
        </nav>
        <div style="margin-top: auto; padding-top: 16px; border-top: 2px solid #000;">
            <div class="nav-item"><span style="border: 1px solid #000; width: 16px; height: 16px; display: inline-block;"></span> Account</div>
        </div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1 class="page-title">Kalender - April 2026</h1>
            <div style="display: flex; gap: 16px;">
                <button class="btn-quick-add"><span style="border: 1px solid #000; width: 12px; height: 12px;"></span> AI Panel</button>
                <button class="btn-quick-add">[+] Tambah Tugas Cepat</button>
            </div>
        </header>
        <div class="page">
            <div style="background: #fff; padding: 24px; border: 2px solid #000;">
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; font-weight: 400; font-size: 13px;">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>
                <div id="calendar-grid">
                    <div></div><div></div><div></div>
                    <div class="cal-day"><div class="cal-day-num">1</div></div>
                    <div class="cal-day"><div class="cal-day-num">2</div></div>
                    <div class="cal-day"><div class="cal-day-num">3</div></div>
                    <div class="cal-day"><div class="cal-day-num">4</div></div>
                    <div class="cal-day today selected"><div class="cal-day-num">5</div><span class="cal-task-label">Laporan IMK Tahap 4</span><span class="cal-task-label">Tugas Jarkom</span></div>
                    <div class="cal-day"><div class="cal-day-num">6</div><span class="cal-task-label">Tugas OOP</span></div>
                    <div class="cal-day"><div class="cal-day-num">7</div></div>
                </div>
            </div>
            <div id="agenda-panel" style="background: #fff; padding: 24px; border: 2px solid #000; margin-top: 24px;">
                <h3 style="font-size:18px; margin-bottom:16px;">Agenda: <span style="font-weight: bold;">5 April 2026</span></h3>
                <div class="task-grid">
                    <div class="task-card urgent" style="padding:16px;">
                        <h3 style="font-size:14px;">Laporan IMK Tahap 4</h3>
                        <p style="font-size:12px;">Desain Pengalaman Pengguna</p>
                        <span class="badge">[waktu] 16:00</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <aside class="ai-panel">
        <div style="padding: 24px; border-bottom: 2px solid #000; display: flex; justify-content: space-between;">
            <div>[ai] Asisten AI</div><span>x</span>
        </div>
        <div style="padding: 24px;">
            <button style="width:100%; background:#fff; border:2px solid #000; padding:12px;">[+] Generate Jadwal Optimal</button>
        </div>
    </aside>
</div>
</body>
</html>
